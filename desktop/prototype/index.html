<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clipboard Desktop Prototype</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #242832;
      --muted: #6f7684;
      --line: #d9dde5;
      --primary: #3f51b5;
      --green: #0b9f6a;
      --orange: #d99016;
      --red: #d5403c;
      --purple: #8b5fbf;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.danger {
      background: #fff5f5;
      border-color: #f2b5b5;
      color: var(--red);
    }

    button.ghost {
      background: transparent;
    }

    .app {
      display: grid;
      grid-template-columns: 220px 320px minmax(0, 1fr);
      height: 100vh;
      transition: grid-template-columns 0.18s ease;
    }

    .app.sidebar-collapsed {
      grid-template-columns: 56px 320px minmax(0, 1fr);
    }

    .sidebar {
      background: #20242e;
      color: #fff;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      padding: 4px 2px 10px;
    }

    .sidebar-toggle {
      width: 32px;
      height: 32px;
      padding: 0;
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      flex: 0 0 auto;
    }

    .nav button {
      width: 100%;
      border: 0;
      color: #d7dce8;
      background: transparent;
      text-align: left;
      margin-bottom: 4px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .nav button.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.09);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .app.sidebar-collapsed .sidebar {
      padding: 10px 8px;
    }

    .app.sidebar-collapsed .brand {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .app.sidebar-collapsed .brand-text,
    .app.sidebar-collapsed .nav-label,
    .app.sidebar-collapsed .side-footer {
      display: none;
    }

    .app.sidebar-collapsed .nav button {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .side-footer {
      margin-top: auto;
      color: #aeb5c5;
      font-size: 12px;
      line-height: 1.5;
    }

    .list-pane {
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .list-toolbar {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      min-width: 0;
    }

    .list {
      overflow: auto;
      padding: 8px;
    }

    .list-item {
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 7px;
      cursor: pointer;
    }

    .list-item:hover {
      background: #f7f8fb;
    }

    .list-item.active {
      border-color: var(--primary);
      background: #f4f6ff;
    }

    .list-title {
      font-weight: 650;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .topbar-title {
      font-weight: 700;
      margin-right: auto;
    }

    .topbar-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-wrap {
      position: relative;
    }

    .data-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 7px);
      width: 210px;
      padding: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 40px rgba(36, 40, 50, 0.16);
      display: none;
      z-index: 30;
    }

    .menu-wrap.open .data-menu {
      display: grid;
      gap: 2px;
    }

    .data-menu button {
      border: 0;
      background: transparent;
      text-align: left;
      border-radius: 5px;
      padding: 8px 10px;
    }

    .data-menu button:hover {
      background: #f3f5fa;
    }

    .content {
      overflow: auto;
      padding: 14px;
      flex: 1;
    }

    .form-grid {
      display: grid;
      gap: 10px;
      max-width: 980px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.5;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .todo-card {
      padding: 0;
      overflow: hidden;
    }

    .todo-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #eef0f4;
      background: #fbfcff;
    }

    .todo-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-right: auto;
    }

    .todo-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 12px;
      background: #fbfcff;
      border-bottom: 1px solid #eef0f4;
    }

    .filter-chip {
      border-radius: 999px;
      padding: 6px 11px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .filter-chip.active {
      background: #eef2ff;
      border-color: #bbc6ff;
      color: var(--primary);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #e4e7ef;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 650;
    }

    .todo-table-wrap {
      overflow: auto;
    }

    .todo-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .todo-table th:nth-child(1),
    .todo-table td:nth-child(1) {
      width: 46px;
    }

    .todo-table th:nth-child(2),
    .todo-table td:nth-child(2) {
      width: 30%;
    }

    .todo-table th:nth-child(3),
    .todo-table td:nth-child(3) {
      width: 82px;
    }

    .todo-table th:nth-child(4),
    .todo-table td:nth-child(4),
    .todo-table th:nth-child(5),
    .todo-table td:nth-child(5),
    .todo-table th:nth-child(6),
    .todo-table td:nth-child(6) {
      width: 64px;
    }

    .todo-table th:nth-child(7),
    .todo-table td:nth-child(7) {
      width: 92px;
    }

    .todo-table th:nth-child(8),
    .todo-table td:nth-child(8) {
      width: 128px;
    }

    .todo-table th:nth-child(9),
    .todo-table td:nth-child(9) {
      width: 58px;
    }

    .todo-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
      padding: 9px 8px;
      border-bottom: 1px solid #e8ebf2;
    }

    .todo-table td {
      padding: 7px 8px;
      border-bottom: 1px solid #eef0f4;
      vertical-align: middle;
    }

    .todo-row {
      border-left: 4px solid transparent;
    }

    .todo-row.priority-high {
      border-left-color: var(--red);
      background: #fffafa;
    }

    .todo-row.priority-medium {
      border-left-color: var(--orange);
    }

    .todo-row:hover {
      background: #f8faff;
    }

    .todo-table input,
    .todo-table select {
      padding: 6px 7px;
      border-radius: 6px;
    }

    .todo-table input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .todo-title-input {
      min-width: 0;
    }

    .todo-progress-input {
      width: 68px;
    }

    .todo-date-input {
      min-width: 0;
    }

    .todo-progress-cell {
      min-width: 0;
    }

    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: #edf0f5;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--primary);
    }

    .todo-row.done .todo-title-input {
      color: var(--muted);
      text-decoration: line-through;
    }

    .topic-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 12px;
      min-height: calc(100vh - 86px);
    }

    .map-shell {
      position: relative;
      background: #fbfcff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 620px;
    }

    .map-help {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 1;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(217, 221, 229, 0.58);
      border-radius: 7px;
      padding: 7px 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
    }

    .map-controls {
      position: absolute;
      right: 12px;
      top: 10px;
      z-index: 4;
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(217, 221, 229, 0.72);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 24px rgba(36, 40, 50, 0.08);
    }

    .map-controls button {
      min-width: 34px;
      height: 30px;
      padding: 0 8px;
      border-radius: 6px;
    }

    .context-menu {
      position: fixed;
      z-index: 60;
      display: none;
      min-width: 168px;
      padding: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 42px rgba(36, 40, 50, 0.18);
    }

    .context-menu.open {
      display: grid;
      gap: 2px;
    }

    .context-menu button {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .context-menu button:hover {
      background: #f3f5fa;
    }

    .kbd {
      display: inline-block;
      min-width: 20px;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-size: 11px;
      font-weight: 650;
    }

    .map-canvas {
      position: relative;
      width: 1600px;
      height: 900px;
      transform-origin: 0 0;
      will-change: transform;
    }

    .edges {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      pointer-events: none;
    }

    .node {
      position: absolute;
      z-index: 2;
      width: 210px;
      min-height: 78px;
      background: #fff;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: 0 8px 24px rgba(36, 40, 50, 0.08);
      cursor: pointer;
    }

    .node.active {
      box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.18), 0 10px 24px rgba(36, 40, 50, 0.12);
    }

    .root-node {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      cursor: default;
    }

    .root-node .node-type {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .node-type {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
      margin-bottom: 7px;
      background: #f2f4ff;
      color: var(--primary);
    }

    .node-title {
      font-weight: 700;
      line-height: 1.35;
    }

    .inspector textarea {
      min-height: 110px;
    }

    .inspector {
      min-width: 0;
      overflow: auto;
      max-height: calc(100vh - 86px);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .pill {
      background: #f2f4f8;
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 50px 10px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <button id="sidebarToggle" class="sidebar-toggle" title="收起侧边栏">☰</button>
        <span class="brand-text">Clipboard Desktop</span>
      </div>
      <nav class="nav">
        <button data-type="notes"><span class="nav-icon">N</span><span class="nav-label">笔记</span></button>
        <button data-type="todos"><span class="nav-icon">T</span><span class="nav-label">待办事项</span></button>
        <button data-type="research"><span class="nav-icon">R</span><span class="nav-label">课题</span></button>
      </nav>
      <div class="side-footer">
        本地原型版<br />
        数据保存在浏览器 localStorage。<br />
        后续迁移到 Tauri + React。
      </div>
    </aside>

    <section class="list-pane">
      <div class="list-toolbar">
        <div class="search-row">
          <input id="searchInput" placeholder="搜索标题和内容" />
          <button id="newButton" class="primary">新建</button>
        </div>
      </div>
      <div id="list" class="list"></div>
    </section>

    <main class="workspace">
      <div class="topbar">
        <div id="topbarTitle" class="topbar-title">笔记</div>
        <div class="topbar-actions">
          <button id="saveButton" class="primary">保存</button>
          <div id="dataMenuWrap" class="menu-wrap">
            <button id="dataMenuButton">数据 ▾</button>
            <div class="data-menu">
              <button id="exportButton">导出原型 JSON</button>
              <button id="importPrototypeButton">导入原型 JSON</button>
              <button id="importAndroidButton">导入安卓明文 JSON</button>
              <button id="encryptedImportButton">安卓加密导入说明</button>
            </div>
          </div>
          <button id="deleteRecordButton" class="danger">删除记录</button>
          <button id="resetButton">恢复示例</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </div>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="contextMenu" class="context-menu"></div>

  <script>
    const STORAGE_KEY = "clipboard-desktop-prototype-v1";
    const RESEARCH_DATA_TYPE = "researchTopic";
    const ROOT_NODE_WIDTH = 210;
    const ROOT_NODE_HEIGHT = 86;
    const ROOT_NODE_X = 80;
    const FIRST_NODE_X = 360;
    const NODE_WIDTH = 210;
    const NODE_HEIGHT = 78;

    const typeLabels = {
      notes: "笔记",
      todos: "待办事项",
      research: "课题",
    };

    const nodeTypeLabels = {
      problem: "问题",
      knowledge: "概念",
      reference: "资料",
      task: "任务",
      conclusion: "结论",
      tool: "工具",
      note: "灵感",
    };

    let state = loadState();
    let currentType = "research";
    let selectedId = state.research[0]?.id || null;
    let selectedNodeId = null;
    let importMode = "prototype";
    const mapViewports = {};
    const todoFilters = {};

    function sampleState() {
      const freecadTopic = {
        id: createId(),
        type: "research",
        dataType: RESEARCH_DATA_TYPE,
        title: "研究 FreeCAD 与 CAD 软件开发路线",
        problem: "理解 CAD 软件开发需要哪些前置知识、开源框架和最小可行 Demo。",
        goal: "把几何内核、建模逻辑、界面、渲染、文件结构串成一个知识网络。",
        conclusion: "",
        viewMode: "map",
        nodes: [],
      };

      const n1 = topicNode("problem", "CAD 软件目标定义", "明确是做查看器、建模器，还是完整参数化 CAD。", 360, 120);
      const n2 = topicNode("knowledge", "FreeCAD 项目结构", "了解 App、Gui、Mod、Document、Workbench 等核心概念。", 640, 90);
      const n3 = topicNode("tool", "OpenCascade / OCC 几何内核", "CAD 几何建模的基础库，负责拓扑、曲面、布尔、导入导出。", 920, 80);
      const n4 = topicNode("task", "参数化建模", "理解模型历史、特征树、依赖更新。", 1200, 70);
      const n5 = topicNode("task", "最小 CAD Demo", "先做能创建简单几何体、显示、保存的小型原型。", 1480, 180);
      const n6 = topicNode("knowledge", "三维视图与渲染", "研究 OpenGL/渲染管线/拾取/相机控制。", 1200, 250);
      const n7 = topicNode("tool", "Qt 界面框架", "FreeCAD 的桌面 UI 基础。", 920, 270);
      n2.relatedNodeIds = [n1.id];
      n3.relatedNodeIds = [n2.id];
      n4.relatedNodeIds = [n3.id];
      n6.relatedNodeIds = [n3.id];
      n7.relatedNodeIds = [n2.id];
      n5.relatedNodeIds = [n4.id, n6.id, n7.id];
      freecadTopic.nodes.push(n1, n2, n3, n4, n5, n6, n7);

      return {
        notes: [
          {
            id: createId(),
            type: "notes",
            title: "桌面端想法",
            content: "先做笔记、待办、课题图谱和搜索。安卓端保持稳定，桌面端通过 JSON 导入导出兼容。",
            updatedAt: today(),
          },
        ],
        todos: [
          {
            id: createId(),
            type: "todos",
            title: "桌面端第一阶段",
            content: "先做一个能运行的本地原型。",
            tasks: [
              task("确定 desktop/ 独立目录", true),
              task("实现课题图谱原型", false),
              task("实现安卓加密导入导出", false),
            ],
            updatedAt: today(),
          },
        ],
        research: [freecadTopic],
      };
    }

    function topicNode(type, title, content, x, y) {
      return normalizeResearchNode({
        id: createId(),
        type,
        title,
        content,
        links: [],
        relatedNodeIds: [],
        mapPositioned: true,
        mapX: x,
        mapY: y,
      });
    }

    function normalizeResearchTopic(topic) {
      if (!topic || typeof topic !== "object") topic = {};
      topic.type = "research";
      topic.dataType = RESEARCH_DATA_TYPE;
      if (!topic.id) topic.id = createId();
      if (!("title" in topic)) topic.title = "";
      if (!("problem" in topic)) topic.problem = "";
      if (!("goal" in topic)) topic.goal = "";
      if (!("conclusion" in topic)) topic.conclusion = "";
      topic.viewMode = topic.viewMode === "card" ? "card" : "map";
      if (!Array.isArray(topic.nodes)) topic.nodes = [];
      topic.nodes = topic.nodes.filter(Boolean).map(normalizeResearchNode);
      return topic;
    }

    function normalizeResearchNode(node) {
      if (!node || typeof node !== "object") node = {};
      if (!node.id) node.id = createId();
      if (!node.type || !String(node.type).trim()) node.type = "note";
      if (!("title" in node)) node.title = "";
      if (!("content" in node)) node.content = "";
      if (!Array.isArray(node.links)) node.links = [];
      if (!Array.isArray(node.relatedNodeIds)) node.relatedNodeIds = [];
      node.mapPositioned = Boolean(node.mapPositioned);
      node.mapX = Number.isFinite(Number(node.mapX)) ? Number(node.mapX) : 0;
      node.mapY = Number.isFinite(Number(node.mapY)) ? Number(node.mapY) : 0;
      return node;
    }

    function task(title, done) {
      return {
        id: createId(),
        title,
        done,
        status: done ? "done" : "todo",
        priority: "medium",
        importance: "normal",
        urgency: "normal",
        progress: done ? 100 : 0,
        dueDate: oneMonthLater(),
      };
    }

    function oneMonthLater() {
      const date = new Date();
      date.setMonth(date.getMonth() + 1);
      return formatDateInput(date);
    }

    function formatDateInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function createId() {
      return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return normalizeState(JSON.parse(raw));
      } catch (error) {
        console.warn(error);
      }
      return normalizeState(sampleState());
    }

    function saveState() {
      normalizeState(state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state, null, 2));
    }

    function normalizeState(next) {
      if (!next || typeof next !== "object") next = {};
      if (!Array.isArray(next.notes)) next.notes = [];
      if (!Array.isArray(next.todos)) next.todos = [];
      if (!Array.isArray(next.research)) next.research = [];
      next.notes = next.notes.filter(Boolean);
      next.notes.forEach((item) => {
        item.type = "notes";
        if (!item.id) item.id = createId();
        if (!("title" in item)) item.title = "";
        if (!("content" in item)) item.content = "";
      });
      next.todos = next.todos.filter(Boolean);
      next.todos.forEach((item) => {
        item.type = "todos";
        if (!item.id) item.id = createId();
        if (!("title" in item)) item.title = "";
        if (!("content" in item)) item.content = "";
        if (!Array.isArray(item.tasks)) item.tasks = [];
        item.tasks.forEach(normalizeTaskFields);
      });
      next.research = next.research.filter(Boolean).map(normalizeResearchTopic);
      return next;
    }

    function currentList() {
      return state[currentType] || [];
    }

    function currentItem() {
      return currentList().find((item) => item.id === selectedId) || currentList()[0] || null;
    }

    function render() {
      document.querySelectorAll(".nav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.type === currentType);
      });
      document.getElementById("topbarTitle").textContent = typeLabels[currentType];
      renderList();
      renderContent();
    }

    function renderList() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const list = document.getElementById("list");
      list.innerHTML = "";
      const items = currentList().filter((item) => {
        if (!query) return true;
        return JSON.stringify(item).toLowerCase().includes(query);
      });
      if (!items.length) {
        list.innerHTML = '<div class="empty">没有匹配内容</div>';
        return;
      }
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "list-item" + (item.id === selectedId ? " active" : "");
        div.innerHTML = `
          <div class="list-title">${escapeHtml(item.title || "未命名")}</div>
          <div class="list-meta">${summaryOf(item)}</div>
        `;
        div.onclick = () => {
          selectedId = item.id;
          selectedNodeId = null;
          render();
        };
        list.appendChild(div);
      });
    }

    function summaryOf(item) {
      if (item.type === "todos") {
        const tasks = Array.isArray(item.tasks) ? item.tasks : [];
        const done = tasks.filter((task) => task.done).length;
        return `${done}/${tasks.length} 已完成`;
      }
      if (item.type === "research") {
        return `${item.nodes.length} 个节点 · ${item.problem || "未写问题定义"}`;
      }
      return item.content || "空笔记";
    }

    function renderContent() {
      const item = currentItem();
      const content = document.getElementById("content");
      if (!item) {
        content.innerHTML = '<div class="empty">新建一个内容开始</div>';
        return;
      }
      if (currentType === "notes") renderNote(content, item);
      if (currentType === "todos") renderTodo(content, item);
      if (currentType === "research") renderResearch(content, item);
    }

    function renderNote(container, item) {
      container.innerHTML = `
        <div class="form-grid">
          <label>标题</label>
          <input id="noteTitle" value="${escapeAttr(item.title)}" />
          <label>内容</label>
          <textarea id="noteContent">${escapeHtml(item.content || "")}</textarea>
        </div>
      `;
    }

    function renderTodo(container, item) {
      if (!Array.isArray(item.tasks)) item.tasks = [];
      item.tasks.forEach(normalizeTaskFields);
      const stats = todoStats(item);
      const currentFilter = todoFilters[item.id] || "active";
      container.innerHTML = `
        <div class="form-grid">
          <label>阶段标题</label>
          <input id="todoTitle" value="${escapeAttr(item.title)}" />
          <div class="card todo-card">
            <div class="todo-header">
              <div class="todo-stats">
                <span class="stat-pill">总数 ${stats.total}</span>
                <span class="stat-pill">完成 ${stats.done}</span>
                <span class="stat-pill">进行中 ${stats.doing}</span>
                <span class="stat-pill">高优先 ${stats.high}</span>
                <span class="stat-pill">逾期 ${stats.overdue}</span>
              </div>
              <button id="addTaskButton" class="primary">添加任务</button>
            </div>
            <div class="todo-filter-row" id="todoFilterRow">
              ${todoFilterButton("active", "活跃", currentFilter)}
              ${todoFilterButton("all", "全部", currentFilter)}
              ${todoFilterButton("doing", "进行中", currentFilter)}
              ${todoFilterButton("done", "已完成", currentFilter)}
              ${todoFilterButton("high", "高优先", currentFilter)}
              ${todoFilterButton("overdue", "逾期", currentFilter)}
              ${todoFilterButton("trash", "回收站", currentFilter)}
            </div>
            <div class="todo-table-wrap">
              <table class="todo-table">
                <thead>
                  <tr>
                    <th>完成</th>
                    <th>任务</th>
                    <th>状态</th>
                    <th>优先级</th>
                    <th>重要</th>
                    <th>紧急</th>
                    <th>进度</th>
                    <th>截止</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="taskList"></tbody>
              </table>
            </div>
          </div>
          <label>阶段备注</label>
          <textarea id="todoContent">${escapeHtml(item.content || "")}</textarea>
        </div>
      `;
      document.querySelectorAll("#todoFilterRow .filter-chip").forEach((button) => {
        button.onclick = () => {
          todoFilters[item.id] = button.dataset.filter;
          render();
        };
      });
      document.getElementById("addTaskButton").onclick = () => {
        item.tasks.unshift(task("新任务", false));
        saveState();
        render();
      };
      const taskList = document.getElementById("taskList");
      const visibleTasks = filteredTodoTasks(item.tasks, currentFilter);
      if (!visibleTasks.length) {
        taskList.innerHTML = '<tr><td colspan="9" class="list-meta">当前筛选下没有任务</td></tr>';
      }
      visibleTasks.forEach(({ taskItem, index }) => {
        const row = document.createElement("tr");
        row.className = `todo-row priority-${taskItem.priority || "medium"}${taskItem.done ? " done" : ""}`;
        row.innerHTML = `
          <td><input class="todo-check" type="checkbox" ${taskItem.done ? "checked" : ""} /></td>
          <td><input class="todo-title-input" type="text" value="${escapeAttr(taskItem.title)}" /></td>
          <td>
            <select class="todo-status">
              <option value="todo" ${taskItem.status === "todo" ? "selected" : ""}>待办</option>
              <option value="doing" ${taskItem.status === "doing" ? "selected" : ""}>进行中</option>
              <option value="done" ${taskItem.status === "done" ? "selected" : ""}>完成</option>
              <option value="trash" ${taskItem.status === "trash" ? "selected" : ""}>回收站</option>
            </select>
          </td>
          <td>
            <select class="todo-priority">
              <option value="low" ${taskItem.priority === "low" ? "selected" : ""}>低</option>
              <option value="medium" ${taskItem.priority === "medium" ? "selected" : ""}>中</option>
              <option value="high" ${taskItem.priority === "high" ? "selected" : ""}>高</option>
            </select>
          </td>
          <td>
            <select class="todo-importance">
              <option value="normal" ${taskItem.importance === "normal" ? "selected" : ""}>普通</option>
              <option value="high" ${taskItem.importance === "high" ? "selected" : ""}>重要</option>
            </select>
          </td>
          <td>
            <select class="todo-urgency">
              <option value="normal" ${taskItem.urgency === "normal" ? "selected" : ""}>普通</option>
              <option value="high" ${taskItem.urgency === "high" ? "selected" : ""}>紧急</option>
            </select>
          </td>
          <td class="todo-progress-cell">
            <input class="todo-progress-input" type="number" min="0" max="100" value="${Number(taskItem.progress) || 0}" />
            <div class="progress-track"><div class="progress-fill" style="width:${clamp(Number(taskItem.progress) || 0, 0, 100)}%"></div></div>
          </td>
          <td><input class="todo-date-input" type="date" value="${escapeAttr(taskItem.dueDate || "")}" /></td>
          <td><button class="ghost">删除</button></td>
        `;
        const checkbox = row.querySelector(".todo-check");
        const input = row.querySelector(".todo-title-input");
        const status = row.querySelector(".todo-status");
        const priority = row.querySelector(".todo-priority");
        const importance = row.querySelector(".todo-importance");
        const urgency = row.querySelector(".todo-urgency");
        const progress = row.querySelector(".todo-progress-input");
        const dueDate = row.querySelector(".todo-date-input");
        const remove = row.querySelector("button");
        checkbox.onchange = () => {
          taskItem.done = checkbox.checked;
          taskItem.status = checkbox.checked ? "done" : "todo";
          if (checkbox.checked && Number(taskItem.progress) < 100) taskItem.progress = 100;
          saveState();
          render();
        };
        input.oninput = () => {
          taskItem.title = input.value;
          saveState();
          renderList();
        };
        status.onchange = () => {
          taskItem.status = status.value;
          taskItem.done = status.value === "done";
          if (taskItem.done && Number(taskItem.progress) < 100) taskItem.progress = 100;
          saveState();
          render();
        };
        priority.onchange = () => {
          taskItem.priority = priority.value;
          saveState();
          renderList();
        };
        importance.onchange = () => {
          taskItem.importance = importance.value;
          saveState();
        };
        urgency.onchange = () => {
          taskItem.urgency = urgency.value;
          saveState();
        };
        progress.onchange = () => {
          taskItem.progress = clamp(Number(progress.value) || 0, 0, 100);
          taskItem.done = taskItem.progress >= 100;
          taskItem.status = taskItem.done ? "done" : taskItem.status === "done" ? "todo" : taskItem.status;
          saveState();
          render();
        };
        dueDate.onchange = () => {
          taskItem.dueDate = dueDate.value;
          saveState();
          render();
        };
        remove.onclick = () => {
          item.tasks.splice(index, 1);
          saveState();
          render();
        };
        taskList.appendChild(row);
      });
    }

    function normalizeTaskFields(taskItem) {
      if (!taskItem.id) taskItem.id = createId();
      if (!taskItem.status) taskItem.status = taskItem.done ? "done" : "todo";
      if (typeof taskItem.done !== "boolean") taskItem.done = taskItem.status === "done";
      if (!taskItem.priority) taskItem.priority = "medium";
      if (!taskItem.importance) taskItem.importance = "normal";
      if (!taskItem.urgency) taskItem.urgency = "normal";
      if (typeof taskItem.progress !== "number") taskItem.progress = taskItem.done ? 100 : 0;
      if (!("dueDate" in taskItem)) taskItem.dueDate = "";
    }

    function todoStats(item) {
      const todayText = today();
      const activeTasks = item.tasks.filter((taskItem) => taskItem.status !== "trash");
      return {
        total: activeTasks.length,
        done: activeTasks.filter((taskItem) => taskItem.done || taskItem.status === "done").length,
        doing: activeTasks.filter((taskItem) => taskItem.status === "doing").length,
        high: activeTasks.filter((taskItem) => taskItem.priority === "high" && !taskItem.done).length,
        overdue: activeTasks.filter((taskItem) => taskItem.dueDate && taskItem.dueDate < todayText && !taskItem.done).length,
      };
    }

    function filteredTodoTasks(tasks, filter) {
      const todayText = today();
      return tasks
        .map((taskItem, index) => ({ taskItem, index }))
        .filter(({ taskItem }) => {
          if (filter === "all") return true;
          if (filter === "done") return taskItem.done || taskItem.status === "done";
          if (filter === "doing") return taskItem.status === "doing";
          if (filter === "high") return taskItem.priority === "high" && taskItem.status !== "trash";
          if (filter === "overdue") return taskItem.dueDate && taskItem.dueDate < todayText && !taskItem.done && taskItem.status !== "trash";
          if (filter === "trash") return taskItem.status === "trash";
          return taskItem.status !== "trash" && !taskItem.done;
        });
    }

    function todoFilterButton(value, label, currentFilter) {
      return `<button class="filter-chip ${value === currentFilter ? "active" : ""}" data-filter="${value}">${label}</button>`;
    }

    function todoSummary(item) {
      const stats = todoStats(item);
      if (!stats.total) return "还没有任务";
      return `完成 ${stats.done}/${stats.total} · 进行中 ${stats.doing} · 高优先 ${stats.high}`;
    }

    function renderResearch(container, topic) {
      if (!selectedNodeId && topic.nodes[0]) selectedNodeId = topic.nodes[0].id;
      container.innerHTML = `
        <div class="topic-layout">
          <div class="map-shell" id="mapShell">
            <div class="map-help">
              空白拖动移动画布，滚轮缩放。<br />
              右键打开快捷菜单。<span class="kbd">Space</span> 改标题，<span class="kbd">F</span> 适配。
            </div>
            <div class="map-controls">
              <button id="zoomOutButton" title="缩小">-</button>
              <button id="zoomInButton" title="放大">+</button>
              <button id="fitMapButton" title="适配到视图">适配</button>
              <button id="resetViewButton" title="重置缩放">1:1</button>
            </div>
            <div class="map-canvas" id="mapCanvas">
              <svg class="edges" id="edges"></svg>
            </div>
          </div>
          <aside class="inspector">
            <div class="card">
              <label>课题标题</label>
              <input id="topicTitle" value="${escapeAttr(topic.title || "")}" />
              <label>问题定义</label>
              <textarea id="topicProblem">${escapeHtml(topic.problem || "")}</textarea>
              <label>阶段目标</label>
              <textarea id="topicGoal">${escapeHtml(topic.goal || "")}</textarea>
              <label>阶段结论</label>
              <textarea id="topicConclusion">${escapeHtml(topic.conclusion || "")}</textarea>
            </div>
            <div class="card">
              <button id="addChildNodeButton" class="primary">子节点</button>
              <button id="addSiblingNodeButton">并行节点</button>
              <button id="autoLayoutButton">自动重排</button>
            </div>
            <div class="card" id="nodeEditor"></div>
          </aside>
        </div>
      `;
      drawMap(topic);
      renderNodeEditor(topic);
      wireTopicFields(topic);
      wireMapShell(topic);
      const viewport = getTopicViewport(topic);
      if (!viewport.initialized) {
        openMapReadable(topic);
        viewport.initialized = true;
      }
    }

    function wireTopicFields(topic) {
      document.getElementById("topicTitle").oninput = (event) => {
        topic.title = event.target.value;
        saveState();
        renderList();
      };
      document.getElementById("topicProblem").oninput = (event) => {
        topic.problem = event.target.value;
        saveState();
        renderList();
      };
      document.getElementById("topicGoal").oninput = (event) => {
        topic.goal = event.target.value;
        saveState();
      };
      document.getElementById("topicConclusion").oninput = (event) => {
        topic.conclusion = event.target.value;
        saveState();
      };
      document.getElementById("addChildNodeButton").onclick = () => addChildNode(topic);
      document.getElementById("addSiblingNodeButton").onclick = () => addSiblingNode(topic);
      document.getElementById("autoLayoutButton").onclick = () => {
        if (!confirm("会恢复节点自动位置，但不会删除节点和关联关系。确定重排吗？")) return;
        autoLayout(topic);
        saveState();
        render();
      };
    }

    function addChildNode(topic, position) {
      const parent = topic.nodes.find((node) => node.id === selectedNodeId);
      const rootBox = rootBoxForTopic(topic);
      const preferredX = position ? position.x : parent ? parent.mapX + 280 : FIRST_NODE_X;
      const preferredY = position ? position.y : parent ? parent.mapY + 80 : rootBox.mapY + 4;
      const openPosition = findOpenPosition(topic, preferredX, preferredY);
      const next = topicNode(
        "note",
        parent ? "新子节点" : "新节点",
        "",
        openPosition.x,
        openPosition.y
      );
      if (parent) next.relatedNodeIds = [parent.id];
      topic.nodes.push(next);
      selectedNodeId = next.id;
      saveState();
      render();
    }

    function addSiblingNode(topic, position) {
      const current = topic.nodes.find((node) => node.id === selectedNodeId);
      const rootBox = rootBoxForTopic(topic);
      const preferredX = position ? position.x : current ? current.mapX : FIRST_NODE_X;
      const preferredY = position ? position.y : current ? current.mapY + 130 : rootBox.mapY + 4;
      const openPosition = findOpenPosition(topic, preferredX, preferredY);
      const next = topicNode(
        "note",
        current ? "新并行节点" : "新节点",
        "",
        openPosition.x,
        openPosition.y
      );
      if (current) {
        next.relatedNodeIds = [...current.relatedNodeIds];
      }
      topic.nodes.push(next);
      selectedNodeId = next.id;
      saveState();
      render();
    }

    function addFreeNode(topic, position) {
      const openPosition = findOpenPosition(topic, position?.x ?? FIRST_NODE_X, position?.y ?? 120);
      const next = topicNode("note", "新节点", "", openPosition.x, openPosition.y);
      topic.nodes.push(next);
      selectedNodeId = next.id;
      saveState();
      render();
    }

    function findOpenPosition(topic, preferredX, preferredY) {
      const startX = Math.max(FIRST_NODE_X, Math.round(preferredX));
      const startY = Math.max(50, Math.round(preferredY));
      const stepX = 280;
      const stepY = 128;
      for (let column = 0; column < 8; column++) {
        for (let ring = 0; ring < 10; ring++) {
          const offsets = ring === 0 ? [0] : [ring * stepY, -ring * stepY];
          for (let i = 0; i < offsets.length; i++) {
            const candidate = {
              x: startX + column * stepX,
              y: Math.max(50, startY + offsets[i]),
            };
            if (!isNodePositionOccupied(topic, candidate.x, candidate.y)) {
              return candidate;
            }
          }
        }
      }
      return { x: startX + stepX, y: startY + topic.nodes.length * stepY };
    }

    function isNodePositionOccupied(topic, x, y) {
      const margin = 18;
      return topic.nodes.some((node) => {
        return x < node.mapX + NODE_WIDTH + margin
          && x + NODE_WIDTH + margin > node.mapX
          && y < node.mapY + NODE_HEIGHT + margin
          && y + NODE_HEIGHT + margin > node.mapY;
      });
    }

    function drawMap(topic) {
      autoLayoutMissing(topic);
      const canvas = document.getElementById("mapCanvas");
      applyMapTransform(topic);
      redrawEdges(topic);
      const rootBox = rootBoxForTopic(topic);
      const root = document.createElement("div");
      root.className = "node root-node" + (!selectedNodeId ? " active" : "");
      root.style.left = `${rootBox.mapX}px`;
      root.style.top = `${rootBox.mapY}px`;
      root.style.width = `${ROOT_NODE_WIDTH}px`;
      root.style.minHeight = `${ROOT_NODE_HEIGHT}px`;
      root.innerHTML = `
        <div class="node-type">课题</div>
        <div class="node-title">${escapeHtml(topic.title || "未命名课题")}</div>
      `;
      root.onclick = () => {
        selectedNodeId = null;
        renderNodeEditor(topic);
        drawMapOnly(topic);
      };
      root.oncontextmenu = (event) => {
        event.preventDefault();
        event.stopPropagation();
        selectedNodeId = null;
        renderNodeEditor(topic);
        drawMapOnly(topic);
        showRootContextMenu(event, topic);
      };
      canvas.appendChild(root);
      topic.nodes.forEach((node) => {
        const div = document.createElement("div");
        div.className = "node" + (node.id === selectedNodeId ? " active" : "");
        div.style.left = `${node.mapX}px`;
        div.style.top = `${node.mapY}px`;
        div.style.borderColor = typeColor(node.type);
        div.innerHTML = `
          <div class="node-type" style="color:${typeColor(node.type)}">${nodeTypeLabels[node.type] || node.type}</div>
          <div class="node-title">${escapeHtml(node.title || "未命名")}</div>
        `;
        div.onclick = () => {
          selectedNodeId = node.id;
          render();
        };
        div.oncontextmenu = (event) => {
          event.preventDefault();
          event.stopPropagation();
          selectedNodeId = node.id;
          renderNodeEditor(topic);
          drawMapOnly(topic);
          showNodeContextMenu(event, topic, node);
        };
        makeDraggable(div, node, topic);
        canvas.appendChild(div);
      });
    }

    function redrawEdges(topic) {
      const svg = document.getElementById("edges");
      svg.innerHTML = "";
      const rootBox = rootBoxForTopic(topic);
      topic.nodes.forEach((to) => {
        let hasVisibleRelated = false;
        to.relatedNodeIds.forEach((id) => {
          const from = topic.nodes.find((node) => node.id === id);
          if (!from) return;
          hasVisibleRelated = true;
          svg.appendChild(edgePath(from, to));
        });
        if (!hasVisibleRelated) {
          svg.appendChild(rootEdgePath(rootBox, to));
        }
      });
    }

    function edgePath(from, to) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const sx = from.mapX + 210;
      const sy = from.mapY + 39;
      const ex = to.mapX;
      const ey = to.mapY + 39;
      const mx = (sx + ex) / 2;
      path.setAttribute("d", `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ey}, ${ex} ${ey}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", typeColor(from.type));
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-opacity", "0.55");
      return path;
    }

    function rootEdgePath(rootBox, to) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const sx = rootBox.mapX + ROOT_NODE_WIDTH;
      const sy = rootBox.mapY + ROOT_NODE_HEIGHT / 2;
      const ex = to.mapX;
      const ey = to.mapY + NODE_HEIGHT / 2;
      const mx = (sx + ex) / 2;
      path.setAttribute("d", `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ey}, ${ex} ${ey}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", typeColor(to.type));
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-opacity", "0.42");
      return path;
    }

    function rootBoxForTopic(topic) {
      const minNodeX = topic.nodes.length ? Math.min(...topic.nodes.map((node) => node.mapX)) : FIRST_NODE_X;
      const rootX = Math.min(ROOT_NODE_X, minNodeX - 280);
      let y = 120;
      const rootLevelNodes = topic.nodes.filter((node) => !hasVisibleRelatedNode(topic, node));
      const targetNodes = rootLevelNodes.length ? rootLevelNodes : topic.nodes;
      if (targetNodes.length) {
        const centerSum = targetNodes.reduce((sum, node) => sum + node.mapY + NODE_HEIGHT / 2, 0);
        y = centerSum / targetNodes.length - ROOT_NODE_HEIGHT / 2;
      }
      return {
        mapX: rootX,
        mapY: Math.max(40, y),
      };
    }

    function hasVisibleRelatedNode(topic, node) {
      return node.relatedNodeIds.some((id) => topic.nodes.some((item) => item.id === id));
    }

    function makeDraggable(element, node, topic) {
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let originalX = 0;
      let originalY = 0;
      element.onpointerdown = (event) => {
        dragging = true;
        startX = event.clientX;
        startY = event.clientY;
        originalX = node.mapX;
        originalY = node.mapY;
        element.setPointerCapture(event.pointerId);
      };
      element.onpointermove = (event) => {
        if (!dragging) return;
        const viewport = getTopicViewport(topic);
        node.mapX = originalX + (event.clientX - startX) / viewport.scale;
        node.mapY = originalY + (event.clientY - startY) / viewport.scale;
        node.mapPositioned = true;
        element.style.left = `${node.mapX}px`;
        element.style.top = `${node.mapY}px`;
        redrawEdges(topic);
      };
      element.onpointerup = () => {
        if (!dragging) return;
        dragging = false;
        saveState();
      };
    }

    function getTopicViewport(topic) {
      if (!mapViewports[topic.id]) {
        mapViewports[topic.id] = { scale: 1, x: 0, y: 0, initialized: false };
      }
      return mapViewports[topic.id];
    }

    function applyMapTransform(topic) {
      const canvas = document.getElementById("mapCanvas");
      if (!canvas) return;
      const viewport = getTopicViewport(topic);
      canvas.style.transform = `translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.scale})`;
    }

    function clientToWorld(topic, clientX, clientY) {
      const shell = document.getElementById("mapShell");
      const viewport = getTopicViewport(topic);
      const rect = shell.getBoundingClientRect();
      return {
        x: (clientX - rect.left - viewport.x) / viewport.scale,
        y: (clientY - rect.top - viewport.y) / viewport.scale,
      };
    }

    function zoomMapAt(topic, clientX, clientY, factor) {
      const shell = document.getElementById("mapShell");
      if (!shell) return;
      const viewport = getTopicViewport(topic);
      const oldScale = viewport.scale;
      const nextScale = clamp(oldScale * factor, 0.25, 2.8);
      const rect = shell.getBoundingClientRect();
      const focusX = clientX - rect.left;
      const focusY = clientY - rect.top;
      const worldX = (focusX - viewport.x) / oldScale;
      const worldY = (focusY - viewport.y) / oldScale;
      viewport.scale = nextScale;
      viewport.x = focusX - worldX * nextScale;
      viewport.y = focusY - worldY * nextScale;
      viewport.initialized = true;
      applyMapTransform(topic);
    }

    function zoomMapToCenter(topic, factor) {
      const shell = document.getElementById("mapShell");
      if (!shell) return;
      const rect = shell.getBoundingClientRect();
      zoomMapAt(topic, rect.left + rect.width / 2, rect.top + rect.height / 2, factor);
    }

    function resetMapViewport(topic) {
      const viewport = getTopicViewport(topic);
      viewport.scale = 1;
      viewport.x = 0;
      viewport.y = 0;
      viewport.initialized = true;
      applyMapTransform(topic);
    }

    function fitMapToView(topic) {
      const shell = document.getElementById("mapShell");
      if (!shell) {
        resetMapViewport(topic);
        return;
      }
      const rootBox = rootBoxForTopic(topic);
      const boxes = [
        { x: rootBox.mapX, y: rootBox.mapY, width: ROOT_NODE_WIDTH, height: ROOT_NODE_HEIGHT },
        ...topic.nodes.map((node) => ({ x: node.mapX, y: node.mapY, width: NODE_WIDTH, height: NODE_HEIGHT + 22 })),
      ];
      const minX = Math.min(...boxes.map((box) => box.x));
      const minY = Math.min(...boxes.map((box) => box.y));
      const maxX = Math.max(...boxes.map((box) => box.x + box.width));
      const maxY = Math.max(...boxes.map((box) => box.y + box.height));
      const width = Math.max(maxX - minX, 1);
      const height = Math.max(maxY - minY, 1);
      const margin = 80;
      const availableWidth = Math.max(shell.clientWidth - margin * 2, 100);
      const availableHeight = Math.max(shell.clientHeight - margin * 2, 100);
      const scale = clamp(Math.min(availableWidth / width, availableHeight / height), 0.25, 2.8);
      const viewport = getTopicViewport(topic);
      viewport.scale = scale;
      viewport.x = (shell.clientWidth - width * scale) / 2 - minX * scale;
      viewport.y = (shell.clientHeight - height * scale) / 2 - minY * scale;
      viewport.initialized = true;
      applyMapTransform(topic);
    }

    function openMapReadable(topic) {
      const shell = document.getElementById("mapShell");
      if (!shell) return;
      const rootBox = rootBoxForTopic(topic);
      const viewport = getTopicViewport(topic);
      viewport.scale = 1;
      viewport.x = 42 - rootBox.mapX;
      viewport.y = Math.max(24, shell.clientHeight / 2 - (rootBox.mapY + ROOT_NODE_HEIGHT / 2));
      viewport.initialized = true;
      applyMapTransform(topic);
    }

    function wireMapShell(topic) {
      const shell = document.getElementById("mapShell");
      if (!shell) return;
      let panning = false;
      let startX = 0;
      let startY = 0;
      let originX = 0;
      let originY = 0;

      shell.onpointerdown = (event) => {
        if (event.target.closest(".node") || event.target.closest(".map-controls")) return;
        hideContextMenu();
        panning = true;
        startX = event.clientX;
        startY = event.clientY;
        const viewport = getTopicViewport(topic);
        originX = viewport.x;
        originY = viewport.y;
        shell.setPointerCapture(event.pointerId);
      };
      shell.onpointermove = (event) => {
        if (!panning) return;
        const viewport = getTopicViewport(topic);
        viewport.x = originX + event.clientX - startX;
        viewport.y = originY + event.clientY - startY;
        viewport.initialized = true;
        applyMapTransform(topic);
      };
      shell.onpointerup = () => {
        panning = false;
      };
      shell.onwheel = (event) => {
        event.preventDefault();
        zoomMapAt(topic, event.clientX, event.clientY, event.deltaY < 0 ? 1.12 : 0.88);
      };
      shell.oncontextmenu = (event) => {
        if (event.target.closest(".node") || event.target.closest(".map-controls")) return;
        event.preventDefault();
        showBlankContextMenu(event, topic, clientToWorld(topic, event.clientX, event.clientY));
      };
      document.getElementById("zoomOutButton").onclick = () => zoomMapToCenter(topic, 0.86);
      document.getElementById("zoomInButton").onclick = () => zoomMapToCenter(topic, 1.16);
      document.getElementById("fitMapButton").onclick = () => fitMapToView(topic);
      document.getElementById("resetViewButton").onclick = () => resetMapViewport(topic);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function showContextMenu(event, actions) {

      const rect = menu.getBoundingClientRect();
      const left = Math.min(event.clientX, window.innerWidth - rect.width - 8);
      const top = Math.min(event.clientY, window.innerHeight - rect.height - 8);
      menu.style.left = `${Math.max(left, 8)}px`;
      menu.style.top = `${Math.max(top, 8)}px`;
    }

    function renderNodeEditor(topic) {
      const editor = document.getElementById("nodeEditor");
      const node = topic.nodes.find((item) => item.id === selectedNodeId);
      if (!node) {

      const builtInTypeOptions = Object.keys(nodeTypeLabels)

      `;
      document.getElementById("nodeType").onchange = (event) => {

          if (customType && customType.trim()) {

        render();

      document.getElementById("nodeTitle").oninput = (event) => {

        saveState();
        renderList();
        drawMapOnly(topic);
      };
      document.getElementById("nodeContent").oninput = (event) => {
        node.content = event.target.value;
        saveState();
      };
      document.getElementById("nodeLinks").oninput = (event) => {
        node.links = event.target.value
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        saveState();
      };
      document.getElementById("nodeRelations").onchange = (event) => {
        node.relatedNodeIds = Array.from(event.target.selectedOptions).map((option) => option.value);
        saveState();
        render();
      };
      document.getElementById("deleteNodeButton").onclick = () => {
        deleteSelectedNode(topic);
      };
    }

    function deleteSelectedNode(topic) {
      const node = topic.nodes.find((item) => item.id === selectedNodeId);
      if (!node) return;
      if (!confirm("确定删除这个节点吗？")) return;
      topic.nodes = topic.nodes.filter((item) => item.id !== node.id);
      topic.nodes.forEach((item) => {
        item.relatedNodeIds = item.relatedNodeIds.filter((id) => id !== node.id);
      });
      selectedNodeId = topic.nodes[0]?.id || null;
      saveState();
      render();
    }

    function focusSelectedNodeTitle() {
      if (!selectedNodeId) {
        const topicTitle = document.getElementById("topicTitle");
        if (topicTitle) {
          topicTitle.focus();

        }
        return;
      }
      const titleInput = document.getElementById("nodeTitle");

    }

    function selectNodeByDirection(topic, direction) {
      const current = topic.nodes.find((node) => node.id === selectedNodeId);
      const rootBox = rootBoxForTopic(topic);
      const currentCenterX = current ? current.mapX + NODE_WIDTH / 2 : rootBox.mapX + ROOT_NODE_WIDTH / 2;
      const currentCenterY = current ? current.mapY + NODE_HEIGHT / 2 : rootBox.mapY + ROOT_NODE_HEIGHT / 2;
      let bestNode = null;
      let bestScore = Number.POSITIVE_INFINITY;
      topic.nodes.forEach((node) => {
        if (current && node.id === current.id) return;
        const dx = node.mapX + NODE_WIDTH / 2 - currentCenterX;
        const dy = node.mapY + NODE_HEIGHT / 2 - currentCenterY;
        let primary;
        let orthogonal;
        if (direction === "left") {
          if (dx >= 0) return;
          primary = Math.abs(dx);
          orthogonal = Math.abs(dy);
        } else if (direction === "right") {
          if (dx <= 0) return;
          primary = Math.abs(dx);
          orthogonal = Math.abs(dy);
        } else if (direction === "up") {
          if (dy >= 0) return;
          primary = Math.abs(dy);
          orthogonal = Math.abs(dx);
        } else {
          if (dy <= 0) return;
          primary = Math.abs(dy);
          orthogonal = Math.abs(dx);
        }
        const score = primary + orthogonal * 0.55;
        if (score < bestScore) {
          bestScore = score;
          bestNode = node;
        }
      });
      if (!bestNode) return;
      selectedNodeId = bestNode.id;
      render();
    }

    function autoLayoutMissing(topic) {
      if (topic.nodes.every((node) => node.mapPositioned)) return;
      autoLayout(topic, true);
    }

    function autoLayout(topic, onlyMissing = false) {
      const levels = new Map();
      const nodeMap = new Map(topic.nodes.map((node) => [node.id, node]));
      const levelOf = (node, visiting = new Set()) => {
        if (levels.has(node.id)) return levels.get(node.id);
        if (visiting.has(node.id)) return 1;
        visiting.add(node.id);
        let level = 1;
        node.relatedNodeIds.forEach((id) => {
          const related = nodeMap.get(id);
          if (related) level = Math.max(level, levelOf(related, visiting) + 1);
        });
        visiting.delete(node.id);
        levels.set(node.id, level);
        return level;
      };
      topic.nodes.forEach((node) => levelOf(node));
      const columns = new Map();
      topic.nodes.forEach((node) => {
        const level = levels.get(node.id) || 0;
        if (!columns.has(level)) columns.set(level, []);
        columns.get(level).push(node);
      });
      columns.forEach((nodes, level) => {
        nodes.forEach((node, index) => {
          if (onlyMissing && node.mapPositioned) return;
          node.mapX = FIRST_NODE_X + (level - 1) * 280;
          node.mapY = 90 + index * 130;
          node.mapPositioned = true;
        });
      });
    }

    function typeColor(type) {
      if (type === "problem") return "var(--red)";
      if (type === "reference") return "var(--green)";
      if (type === "task") return "var(--orange)";
      if (type === "conclusion") return "var(--purple)";
      if (type === "tool") return "#00897b";
      if (type === "knowledge") return "var(--primary)";
      return "#8a919f";
    }

        item = { id: createId(), type: "notes", title: "新笔记", content: "", updatedAt: today() };
      } else if (currentType === "todos") {
        item = { id: createId(), type: "todos", title: "新待办", content: "", tasks: [], updatedAt: today() };
      } else {
        item = normalizeResearchTopic({ id: createId(), title: "新课题", problem: "", goal: "", conclusion: "", viewMode: "map", nodes: [] });
      }
      list.unshift(item);
      selectedId = item.id;

      saveState();
      render();

    function deleteCurrentRecord() {
      const list = currentList();
      const item = currentItem();
      if (!item) return;
      const title = item.title || "未命名";
      if (!confirm(`确定删除当前${typeLabels[currentType]}记录「${title}」吗？这个操作只删除当前原型里的本地数据。`)) return;
      const index = list.findIndex((value) => value.id === item.id);
      if (index < 0) return;
      list.splice(index, 1);
      selectedId = list[Math.min(index, list.length - 1)]?.id || null;
      selectedNodeId = null;
      saveState();

    function exportData() {
      collectCurrentForm();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `clipboard-desktop-${today()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const next = JSON.parse(reader.result);
          if (importMode === "prototype") {
            state = normalizePrototypeData(next);
          } else if (importMode === "androidPlain") {
            state = mergeAndroidPlainExport(state, next);
          }
          selectedId = state[currentType][0]?.id || null;
          selectedNodeId = null;
          saveState();
          render();
        } catch (error) {
          alert(importMode === "androidPlain"
            ? "导入失败：目前只支持安卓未加密 JSON，安卓加密文件需要 Tauri 后端解密。"
            : "导入失败：不是这个原型的 JSON 数据。");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    function normalizePrototypeData(next) {
      if (!next.notes || !next.todos || !next.research) {
        throw new Error("invalid prototype data");
      }
      return normalizeState(next);
    }

    function mergeAndroidPlainExport(current, androidJson) {
      if (!Array.isArray(androidJson.clips)) {
        throw new Error("invalid android export");
      }
      const imported = { notes: [], todos: [], research: [] };
      androidJson.clips.forEach((clip) => {
        const catalogue = clip.catalogue || "";
        const title = clip.remark || firstLine(clip.content, "未命名");
        if (catalogue === "课题") {
          const topic = safeParseJson(clip.content);
          if (topic && Array.isArray(topic.nodes)) {
            imported.research.push({
              id: createId(),
              type: "research",
              dataType: RESEARCH_DATA_TYPE,
              title: topic.title || title,
              problem: topic.problem || "",
              goal: topic.goal || "",
              conclusion: topic.conclusion || "",
              viewMode: topic.viewMode || "map",
              nodes: (topic.nodes || []).map(normalizeResearchNode),
              androidOrderId: clip.orderid,
              updatedAt: clip.datetime || today(),
            });
          }
        } else if (catalogue === "待办事项") {
          const board = safeParseJson(clip.content);
          imported.todos.push({
            id: createId(),
            type: "todos",
            title,
            content: board?.content || clip.content || "",
            tasks: Array.isArray(board?.tasks)
              ? board.tasks.map((taskItem) => ({
                  id: taskItem.taskId || taskItem.id || createId(),
                  title: taskItem.title || "未命名任务",
                  done: taskItem.finished || taskItem.status === "done",
                  status: taskItem.status || (taskItem.finished ? "done" : "todo"),
                  priority: taskItem.priority || "medium",
                  importance: taskItem.importance || "normal",
                  urgency: taskItem.urgency || "normal",
                  progress: Number(taskItem.progress) || 0,
                  dueDate: taskItem.dueDate || taskItem.endTime || "",
                }))
              : [],
            androidOrderId: clip.orderid,
            updatedAt: clip.datetime || today(),
          });
        } else {
          imported.notes.push({
            id: createId(),
            type: "notes",
            title,
            content: clip.content || "",
            androidCatalogue: catalogue,
            androidOrderId: clip.orderid,
            updatedAt: clip.datetime || today(),
          });
        }
      });
      return normalizeState({
        notes: [...imported.notes, ...current.notes],
        todos: [...imported.todos, ...current.todos],
        research: [...imported.research, ...current.research],
      });
    }

    function safeParseJson(value) {
      try {
        return JSON.parse(value || "");
      } catch (error) {
        return null;
      }
    }

    function firstLine(value, fallback) {
      const text = String(value || "").trim();
      if (!text) return fallback;
      const index = text.indexOf("\n");
      return index >= 0 ? text.slice(0, index).trim() : text;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('"', "&quot;");
    }

    document.querySelectorAll(".nav button").forEach((button) => {
      button.onclick = () => {
        collectCurrentForm();
        currentType = button.dataset.type;

        selectedNodeId = null;
        render();
      };
    });

    const appElement = document.getElementById("app");
    const sidebarCollapsedKey = STORAGE_KEY + "-sidebar-collapsed";
    if (localStorage.getItem(sidebarCollapsedKey) === "1") {
      appElement.classList.add("sidebar-collapsed");
    }
    document.getElementById("sidebarToggle").onclick = () => {
      appElement.classList.toggle("sidebar-collapsed");
      localStorage.setItem(sidebarCollapsedKey, appElement.classList.contains("sidebar-collapsed") ? "1" : "0");
    };

    const dataMenuWrap = document.getElementById("dataMenuWrap");
    function closeDataMenu() {
      dataMenuWrap.classList.remove("open");
    }
    document.getElementById("dataMenuButton").onclick = (event) => {
      event.stopPropagation();
      dataMenuWrap.classList.toggle("open");
    };
    document.addEventListener("click", (event) => {
      if (!dataMenuWrap.contains(event.target)) closeDataMenu();
      if (!event.target.closest(".context-menu")) hideContextMenu();
    });

    document.getElementById("searchInput").oninput = renderList;
    document.getElementById("newButton").onclick = createNew;
    document.getElementById("saveButton").onclick = () => {
      collectCurrentForm();
      render();
    };
    document.getElementById("deleteRecordButton").onclick = deleteCurrentRecord;
    document.getElementById("resetButton").onclick = () => {
      if (!confirm("恢复示例会覆盖原型本地数据，确定吗？")) return;
      state = sampleState();
      selectedId = state[currentType][0]?.id || null;
      selectedNodeId = null;
      saveState();
      render();
    };
    document.getElementById("exportButton").onclick = () => {
      closeDataMenu();
      exportData();
    };
    document.getElementById("importPrototypeButton").onclick = () => {
      closeDataMenu();
      importMode = "prototype";
      document.getElementById("importFile").click();
    };
    document.getElementById("importAndroidButton").onclick = () => {
      closeDataMenu();
      importMode = "androidPlain";
      document.getElementById("importFile").click();
    };
    document.getElementById("encryptedImportButton").onclick = () => {
      closeDataMenu();
      alert("安卓加密文件不会在这个浏览器原型里解密。后续 Tauri 版会在 Rust 后端实现兼容解密，密码只由用户输入，不会写进代码或文档。");
    };
    document.getElementById("importFile").onchange = (event) => {
      const file = event.target.files?.[0];
      if (file) importData(file);
      event.target.value = "";
    };

    document.addEventListener("keydown", (event) => {
      const tag = event.target.tagName;
      const isEditingText = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      if (isEditingText || currentType !== "research") return;
      const topic = currentItem();
      if (!topic) return;
      if (event.key === "Tab") {
        event.preventDefault();
        addChildNode(topic);
      } else if (event.key === "Enter") {
        event.preventDefault();
        addSiblingNode(topic);
      } else if (event.key === " " || event.code === "Space") {
        event.preventDefault();
        focusSelectedNodeTitle();
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        selectNodeByDirection(topic, "left");
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        selectNodeByDirection(topic, "right");
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        selectNodeByDirection(topic, "up");
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        selectNodeByDirection(topic, "down");
      } else if (event.key.toLowerCase() === "f") {
        event.preventDefault();
        fitMapToView(topic);
      } else if (event.key === "0") {
        event.preventDefault();
        resetMapViewport(topic);
      } else if (event.key === "=" || event.key === "+") {
        event.preventDefault();
        zoomMapToCenter(topic, 1.16);
      } else if (event.key === "-" || event.key === "_") {
        event.preventDefault();
        zoomMapToCenter(topic, 0.86);
      } else if (event.key === "Delete" && selectedNodeId) {
        event.preventDefault();
        deleteSelectedNode(topic);
      }
    });

    saveState();
    render();
  </script>
</body>
</html>
